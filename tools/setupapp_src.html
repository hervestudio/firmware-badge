<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>badge setup</title>
<style>
  @font-face { font-family: 'DingosBlack'; font-display: swap;
    src: url(data:font/opentype;base64,__DINGOS__) format('opentype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500;
    font-display: swap;
    src: url(data:font/woff2;base64,__INTER__) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#0e120d; color:#fff;
         font-family:'Inter',-apple-system,system-ui,sans-serif;
         min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
         align-items:center; padding:34px 26px 24px; overscroll-behavior:none; }
  .dingos { font-family:'DingosBlack','Inter',sans-serif; font-weight:normal; }
  h1 { font-size:22px; letter-spacing:2px; color:#fff; text-align:center;
       margin-bottom:34px; }
  #st { display:inline-block; width:8px; height:8px; border-radius:50%;
        background:#f0504d; margin-right:10px; vertical-align:3px; }
  #st.ok { background:#7cf59a; }
  .card { display:none; flex-direction:column; width:min(100%,380px); flex:1; }
  .card.on { display:flex; }
  .lab { font-size:15px; letter-spacing:1px; color:#fff; margin:0 0 10px 4px; }
  .lab.dim { color:#8f978f; }
  input[type=text], input[type=url] {
    background:#161b15; color:#fff; border:1.5px solid #262c25;
    border-radius:22px; padding:15px 20px; font-size:17px; width:100%;
    outline:none; font-family:'Inter',sans-serif; margin-bottom:26px;
    transition:border-color .15s; }
  input::placeholder { color:#525b52; }
  input:focus, input.filled { border-color:#fbd975; }
  .hint { font-size:13px; line-height:1.55; color:#8f978f; margin:-14px 4px 24px; }
  /* etape buddy */
  #prevWrap { display:flex; justify-content:center; margin-bottom:18px; }
  #prev { width:120px; height:120px; }
  input[type=range] { width:100%; height:26px; appearance:none;
    background:transparent; margin-bottom:16px; }
  input[type=range]::-webkit-slider-runnable-track { height:12px; border-radius:6px; }
  #hue::-webkit-slider-runnable-track { background:linear-gradient(90deg,
    #ff5f5f,#ffd75f,#7cf59a,#46d7f5,#6a7bff,#e06af5,#ff5f5f); }
  #sat::-webkit-slider-runnable-track { background:linear-gradient(90deg,#8a8a8a,#ff3fd4); }
  input[type=range]::-webkit-slider-thumb { appearance:none; width:22px; height:22px;
    border-radius:50%; background:#fff; border:3px solid #0e120d; margin-top:-5px; }
  #faces { display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
           margin-bottom:12px; }
  #faces button { background:#161b15; border:2px solid #262c25; border-radius:16px;
                  padding:7px; cursor:pointer; }
  #faces button.sel { border-color:#fbd975; }
  #faces canvas { width:100%; display:block; }
  .ghost { background:none; border:none; color:#8f978f; font-size:13px;
           text-decoration:underline; cursor:pointer; align-self:center;
           font-family:'Inter',sans-serif; }
  /* navigation */
  #nav { display:flex; gap:12px; justify-content:center; width:min(100%,380px);
         margin:26px 0 30px; }
  #nav button { border:none; cursor:pointer; border-radius:32px;
                padding:17px 42px; font-size:17px; letter-spacing:1px; }
  #back { background:#1b201a; color:#9aa39a; }
  #next { background:#fff; color:#0e120d; }
  #saved { font-size:12px; color:#7cf59a; height:15px; opacity:0;
           transition:opacity .3s; align-self:center; }
  #saved.show { opacity:1; }
  #steps { display:flex; gap:14px; align-items:center; justify-content:center; }
  .dot { width:28px; height:28px; border-radius:50%; background:#1e1b33;
         color:#8b86b8; display:flex; align-items:center; justify-content:center;
         font-size:13px; cursor:pointer; }
  .dot.on { background:#aaa6fc; color:#211c3b; }
  .bar { width:22px; height:2px; background:#1e1b33; }
</style>
</head>
<body>
<h1 class="dingos"><span id="st"></span>BADGE SETUP</h1>

<div class="card on" id="s0">
  <span class="lab dingos">NAME</span>
  <input type="text" id="name" maxlength="20" placeholder="Ada Lovelace" autocomplete="off">
  <span class="lab dingos dim">COMPANY</span>
  <input type="text" id="company" maxlength="24" placeholder="Apple" autocomplete="off">
  <span class="lab dingos dim">MESSAGE</span>
  <input type="text" id="msg" maxlength="15" placeholder="Hi Buddy &#128075;" autocomplete="off">
</div>

<div class="card" id="s1">
  <span class="lab dingos">YOUR CONF BUDDY</span>
  <div id="prevWrap"><canvas id="prev" width="120" height="120"></canvas></div>
  <span class="lab dingos dim">COLOR</span>
  <input type="range" id="hue" min="0" max="359" value="0">
  <span class="lab dingos dim">INTENSITY</span>
  <input type="range" id="sat" min="35" max="130" value="100">
  <span class="lab dingos dim">FACE</span>
  <div id="faces"></div>
  <button class="ghost" id="reset">use my default badge avatar instead</button>
</div>

<div class="card" id="s2">
  <span class="lab dingos">YOUR QR CODE</span>
  <input type="url" id="url" maxlength="90" placeholder="https://your-site.dev"
         autocapitalize="off" autocorrect="off">
  <p class="hint">Where should your QR code send people? Your website, LinkedIn,
    X&hellip; The badge shows it in <b>Meet &gt; QR Code</b>, with your buddy
    animated in the middle.</p>
</div>

<span id="saved">saved on badge &#10003;</span>
<div id="nav">
  <button id="back" class="dingos">BACK</button>
  <button id="next" class="dingos">NEXT</button>
</div>
<div id="steps">
  <span class="dot on" data-s="0">1</span><span class="bar"></span>
  <span class="dot" data-s="1">2</span><span class="bar"></span>
  <span class="dot" data-s="2">3</span>
</div>

<script>
let step = 0, ws = null, hue = 0, sat = 100, face = 0, custom = 0;

// ---- mini rendus des 9 visages (approximation du rendu badge) ----
function drawFace(ctx, s, id, hu, sa) {
  ctx.clearRect(0, 0, s, s);
  const g = ctx.createRadialGradient(s*0.38, s*0.34, s*0.06, s*0.5, s*0.5, s*0.55);
  const h = (n) => 'hsl(' + ((n + hu) % 360) + ',' + Math.min(95, sa*0.85) + '%,60%)';
  g.addColorStop(0, h(45)); g.addColorStop(0.5, h(310)); g.addColorStop(1, h(260));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s/2, s/2, s*0.46, 0, 7); ctx.fill();
  ctx.fillStyle = '#272727'; ctx.strokeStyle = '#272727';
  ctx.lineWidth = Math.max(2, s*0.05); ctx.lineCap = 'round';
  const e = s*0.16, ey = s*0.42, er = s*0.055, cx = s/2;
  const eyes = () => { ctx.beginPath(); ctx.arc(cx-e, ey, er, 0, 7);
                       ctx.arc(cx+e, ey, er, 0, 7); ctx.fill(); };
  switch (id) {
  case 0: eyes(); ctx.beginPath(); ctx.ellipse(cx, s*0.60, s*0.13, s*0.10, 0, 0, 7);
          ctx.fill(); ctx.beginPath(); ctx.moveTo(cx, s*0.66); ctx.lineTo(cx, s*0.72);
          ctx.stroke(); break;
  case 1: eyes(); ctx.beginPath(); ctx.ellipse(cx, s*0.60, s*0.14, s*0.11, 0, 0, 7);
          ctx.fill(); ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.ellipse(cx, s*0.65, s*0.10, s*0.05, 0, 0, 7); ctx.fill(); break;
  case 2: eyes(); ctx.beginPath(); ctx.arc(cx, s*0.52, s*0.13, 0.4, 2.7); ctx.stroke(); break;
  case 3: eyes(); ctx.beginPath();
          for (let i = 0; i <= 20; i++) { const u = i/20, x = cx - s*0.13 + u*s*0.26;
            const y = s*0.60 + Math.sin(u*9.4)*s*0.03;
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); break;
  case 4: ctx.beginPath(); ctx.ellipse(cx-e, ey, er*0.9, er*1.6, 0, 0, 7);
          ctx.ellipse(cx+e, ey, er*0.9, er*1.6, 0, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(cx-s*0.06, s*0.58, s*0.06, 0.2, 2.9);
          ctx.arc(cx+s*0.06, s*0.58, s*0.06, 0.2, 2.9); ctx.stroke(); break;
  case 5: ctx.fillRect(cx-e-s*0.1, ey-s*0.05, s*0.52, s*0.05);
          ctx.beginPath(); ctx.ellipse(cx-e, ey+s*0.03, s*0.09, s*0.07, 0, 0, 7);
          ctx.ellipse(cx+e, ey+s*0.03, s*0.09, s*0.07, 0, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.moveTo(cx-s*0.08, s*0.64); ctx.lineTo(cx+s*0.09, s*0.60);
          ctx.stroke(); break;
  case 6: ctx.beginPath(); ctx.arc(cx-e, ey+er, er*1.8, 3.4, 6.0);
          ctx.stroke(); ctx.beginPath(); ctx.arc(cx+e, ey+er, er*1.8, 3.4, 6.0); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, s*0.56, s*0.09, 0.4, 2.7); ctx.stroke(); break;
  case 7: eyes(); ctx.beginPath();
          for (let i = 0; i <= 24; i++) { const u = i/24, x = cx - s*0.17 + u*s*0.34;
            const y = s*0.58 + Math.sin(u*6.28)*s*0.045;
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); break;
  case 8: const st = (x) => { for (let k = 0; k < 8; k++) { const a = k*Math.PI/4;
            ctx.beginPath(); ctx.arc(x+Math.cos(a)*er*1.3, ey+Math.sin(a)*er*1.3,
            er*0.7, 0, 7); ctx.fill(); }
            ctx.beginPath(); ctx.arc(x, ey, er*1.3, 0, 7); ctx.fill(); };
          st(cx-e); st(cx+e);
          ctx.fillRect(cx-e, ey-s*0.015, e*2, s*0.03); break;
  }
}
const faces = document.getElementById('faces');
for (let i = 0; i < 9; i++) {
  const b = document.createElement('button');
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  b.appendChild(c);
  b.onclick = () => { face = i; custom = 1; sync(); sendBuddy(); };
  faces.appendChild(b);
}
function sync() {
  document.querySelectorAll('#faces button').forEach((b, i) =>
    b.classList.toggle('sel', i === face));
  document.querySelectorAll('#faces canvas').forEach((c, i) =>
    drawFace(c.getContext('2d'), 64, i, hue, sat));
  drawFace(document.getElementById('prev').getContext('2d'), 120, face, hue, sat);
  document.getElementById('hue').value = hue;
  document.getElementById('sat').value = sat;
}
// bord jaune sur les champs remplis (comme la maquette)
document.querySelectorAll('input[type=text],input[type=url]').forEach(i =>
  i.addEventListener('input', () => i.classList.toggle('filled', !!i.value)));

// ---- navigation ----
function showStep(n) {
  step = Math.max(0, Math.min(2, n));
  for (let i = 0; i < 3; i++) {
    document.getElementById('s' + i).classList.toggle('on', i === step);
    document.querySelector('[data-s="' + i + '"]').classList.toggle('on', i === step);
  }
  document.getElementById('back').style.visibility = step ? 'visible' : 'hidden';
  document.getElementById('next').textContent = step === 2 ? 'DONE' : 'NEXT';
  // le badge suit l'etape : a l'etape QR il affiche le QR code en direct
  if (ws && ws.readyState === 1) ws.send('S' + step);
}
document.getElementById('back').onclick = () => showStep(step - 1);
document.getElementById('next').onclick = () => {
  if (step === 2) { flashSaved(); showStep(0); } else showStep(step + 1);
};
document.querySelectorAll('.dot').forEach(d => d.onclick = () => showStep(+d.dataset.s));

// ---- liaison badge ----
function connect() {
  try { ws = new WebSocket('ws://' + location.hostname + ':81/'); }
  catch (_) { return; } // hors badge (file://...) : la page reste utilisable
  ws.onopen = () => { document.getElementById('st').classList.add('ok');
                      ws.send('S' + step); };
  ws.onclose = () => { document.getElementById('st').classList.remove('ok');
                       setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    if (e.data[0] !== 'J') return;
    try {
      const j = JSON.parse(e.data.slice(1));
      const set = (id, v) => { const el = document.getElementById(id);
        el.value = v || ''; el.classList.toggle('filled', !!v); };
      set('name', j.name); set('company', j.comp); set('msg', j.msg);
      set('url', j.url);
      hue = j.hue || 0; sat = j.sat || 100; face = j.face || 0; custom = j.cust || 0;
      sync();
    } catch (_) {}
  };
}
connect();
let savedT = null;
function flashSaved() {
  const el = document.getElementById('saved');
  el.classList.add('show');
  clearTimeout(savedT);
  savedT = setTimeout(() => el.classList.remove('show'), 1400);
}
function send(msg) {
  if (ws && ws.readyState === 1) { ws.send(msg); flashSaved(); }
}
const debs = {};
function debounced(key, ms, fn) {
  clearTimeout(debs[key]);
  debs[key] = setTimeout(fn, ms);
}
document.getElementById('name').oninput = (e) =>
  debounced('n', 350, () => send('N' + e.target.value.trim()));
document.getElementById('company').oninput = (e) =>
  debounced('c', 350, () => send('C' + e.target.value.trim()));
document.getElementById('msg').oninput = (e) =>
  debounced('m', 350, () => send('M' + e.target.value.trim()));
document.getElementById('url').oninput = (e) => {
  const v = e.target.value.trim();
  // URL incomplete -> le badge montre un QR "en construction"
  if (v.length >= 4 && v.includes('.'))
    debounced('u', 500, () => send('U' + v));
  else if (ws && ws.readyState === 1)
    ws.send('B');
};
function sendBuddy() {
  debounced('a', 120, () => send('A' + hue + ',' + sat + ',' + face));
}
document.getElementById('hue').oninput = (e) => { hue = +e.target.value; custom = 1;
                                                  sync(); sendBuddy(); };
document.getElementById('sat').oninput = (e) => { sat = +e.target.value; custom = 1;
                                                  sync(); sendBuddy(); };
document.getElementById('reset').onclick = () => { custom = 0; send('R'); };
sync(); showStep(0);
</script>
</body>
</html>
