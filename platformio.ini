[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
; Partition scheme with two OTA slots (app0/app1): required for Wi-Fi flashing
board_build.partitions = default_16MB.csv

; Native USB CDC disabled: GPIO 19/20 (USB D-/D+) are used as buttons.
; Flash + logs go through the CH343 UART bridge (Serial0), as before.
build_flags =
    -D BOARD_HAS_PSRAM

monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    https://github.com/MaliosDark/Arduino_GC9B72.git
    links2004/WebSockets@^2.4.1
; Cable-free flashing (Wi-Fi OTA): hold the PREV button (GPIO 20) while
; powering on -> the badge creates the "badge-threejs" network and shows
; the info. Connect the Mac to that Wi-Fi then:  pio run -e ota -t upload
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.4.1

; First prototype (flying wires, wired before 2026-08-14): old screen
; mapping SCLK 12 / MOSI 11 / DC 13 / RST 14 and battery gauge on 5/6.
; Same firmware, only the GPIOs change:  pio run -e proto -t upload
[env:proto]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D PROTO_V1_WIRING
