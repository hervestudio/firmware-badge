[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
; Schema avec deux partitions OTA (app0/app1) : necessaire pour le flash Wi-Fi
board_build.partitions = default_16MB.csv

; USB CDC natif desactive : les GPIO 19/20 (D-/D+ USB) servent de boutons.
; Flash + logs passent par le pont UART CH343 (Serial0), comme avant.
build_flags =
    -D BOARD_HAS_PSRAM

monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    https://github.com/MaliosDark/Arduino_GC9B72.git
    links2004/WebSockets@^2.4.1
; Flash sans cable (OTA Wi-Fi) : maintenir le bouton PREV (GPIO 20) pendant
; l'allumage -> le badge cree le reseau "badge-threejs" et affiche les infos.
; Connecter le Mac a ce Wi-Fi puis :  pio run -e ota -t upload
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.4.1

; Premier prototype (fils volants, cable avant le 2026-08-14) : ancien
; mapping ecran SCLK 12 / MOSI 11 / DC 13 / RST 14 et jauge batterie 5/6.
; Meme firmware, seuls les GPIO changent :  pio run -e proto -t upload
[env:proto]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D PROTO_V1_WIRING
